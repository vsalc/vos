# Second-agent review. Every PR gets an automatic Claude code review posted as PR comments,
# and `@claude` in a PR or issue comment asks Claude a question.
# This is a learning repo: the reviewer names problems and never writes the fix.
# Auth: the Claude GitHub App (https://github.com/apps/claude) must be installed on this repo,
# and CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) must be set as a repository secret.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TEACHING_RULE: >-
    This is a learning repository. The author writes every line of code by hand in order to
    understand it. In every comment, say what is wrong, where, and why it matters, and point to
    the concept, spec section or reference to read. Never write corrected code, never use GitHub
    suggestion blocks, and never push commits or edit files. If asked for the fix, explain the
    idea with an example from a different problem.

jobs:
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1.0.275
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "${{ env.TEACHING_RULE }}"

  mention:
    if: github.event_name != 'pull_request' && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1.0.275
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --append-system-prompt "${{ env.TEACHING_RULE }}"
